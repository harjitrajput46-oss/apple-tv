name: Build GLASS TV APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create GLASS TV project files
        run: |
          set -e
          mkdir -p GLASS-TV
          cd GLASS-TV
          cat > settings.gradle << 'EOF_GLASS'
          include ':app'
          rootProject.name = 'GLASS-TV'
          EOF_GLASS
          cat > build.gradle << 'EOF_GLASS'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF_GLASS
          cat > gradle.properties << 'EOF_GLASS'
          org.gradle.jvmargs=-Xmx2048m
          EOF_GLASS
          mkdir -p app
          cat > app/build.gradle << 'EOF_GLASS'
          apply plugin: 'com.android.application'

          android {
              namespace 'com.iptv.glass'
              compileSdk 34

              defaultConfig {
                  applicationId "com.iptv.glass"
                  minSdk 21
                  targetSdk 22
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF_GLASS
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF_GLASS'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="GLASS TV"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".DetailActivity"
                      android:exported="false"
                      android:screenOrientation="landscape" />
              </application>
          </manifest>
          EOF_GLASS
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml << 'EOF_GLASS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Holo.NoActionBar" />
          </resources>
          EOF_GLASS
          mkdir -p app/src/main
