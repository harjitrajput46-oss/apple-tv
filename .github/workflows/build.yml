                      }
                  });
              }

              private TextView btn(String text, boolean anim) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextColor(0xFFFFFFFF);
                  t.setTextSize(17);
                  t.setPadding(dp(24), dp(12), dp(24), dp(12));
                  U.focusable(t, anim, 30);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2, -2);
                  lp.setMargins(0, 0, dp(12), 0);
                  t.setLayoutParams(lp);
                  return t;
              }

              private Intent findLaunch(String[] pkgs) {
                  for (String p : pkgs) {
                      Intent i = getPackageManager().getLeanbackLaunchIntentForPackage(p);
                      if (i == null) i = getPackageManager().getLaunchIntentForPackage(p);
                      if (i != null) return i;
                  }
                  return null;
              }

              private void trailer() {
                  if (a.trailer == null) {
                      Toast.makeText(this, "Is anime ka trailer available nahi hai", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("vnd.youtube:" + a.trailer)));
                  } catch (Exception e) {
                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/watch?v=" + a.trailer)));
                      } catch (Exception e2) {
                          Toast.makeText(this, "YouTube app ya browser nahi mila", Toast.LENGTH_SHORT).show();
                      }
                  }
              }
