name: Build GLASS TV APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create GLASS TV project files
        run: |
          set -e
          mkdir -p GLASS-TV
          cd GLASS-TV
          cat > settings.gradle << 'EOF_GLASS'
          include ':app'
          rootProject.name = 'GLASS-TV'
          EOF_GLASS
          cat > build.gradle << 'EOF_GLASS'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF_GLASS
          cat > gradle.properties << 'EOF_GLASS'
          org.gradle.jvmargs=-Xmx2048m
          EOF_GLASS
          mkdir -p app
          cat > app/build.gradle << 'EOF_GLASS'
          apply plugin: 'com.android.application'

          android {
              namespace 'com.iptv.glass'
              compileSdk 34

              defaultConfig {
                  applicationId "com.iptv.glass"
                  minSdk 21
                  targetSdk 22
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF_GLASS
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF_GLASS'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="GLASS TV"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".DetailActivity"
                      android:exported="false"
                      android:screenOrientation="landscape" />
              </application>
          </manifest>
          EOF_GLASS
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml << 'EOF_GLASS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Holo.NoActionBar" />
          </resources>
          EOF_GLASS
          mkdir -p app/src/main/java/com/iptv/glass
          cat > app/src/main/java/com/iptv/glass/U.java << 'EOF_GLASS'
          package com.iptv.glass;

          import android.content.Context;
          import android.graphics.Outline;
          import android.graphics.drawable.GradientDrawable;
          import android.view.View;
          import android.view.ViewOutlineProvider;

          public class U {
              public static final String[] THEMES = {"Midnight", "Aurora", "Sunset", "Carbon"};
              private static final int[][] COLORS = {
                      {0xFF0B0B12, 0xFF1B1038, 0xFF0A2A4A},
                      {0xFF06222B, 0xFF0E5C63, 0xFF1E8A8A},
                      {0xFF1B0B2E, 0xFF6A1B4D, 0xFFE0743A},
                      {0xFF050505, 0xFF151518, 0xFF26262B}};

              public static int dp(Context c, float v) {
                  return Math.round(v * c.getResources().getDisplayMetrics().density);
              }

              public static GradientDrawable wallpaper(int i) {
                  return new GradientDrawable(GradientDrawable.Orientation.TL_BR, COLORS[Math.abs(i) % COLORS.length]);
              }

              public static GradientDrawable glass(Context c, boolean focused, float radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(focused ? 0x55FFFFFF : 0x22FFFFFF);
                  g.setCornerRadius(dp(c, radiusDp));
                  g.setStroke(dp(c, focused ? 3 : 1), focused ? 0xFFFFFFFF : 0x33FFFFFF);
                  return g;
              }

              public static void focusable(View v, final boolean anim, final float radius) {
                  v.setFocusable(true);
                  v.setClickable(true);
                  v.setBackground(glass(v.getContext(), false, radius));
                  v.setOnFocusChangeListener(new View.OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View x, boolean focused) {
                          x.setBackground(glass(x.getContext(), focused, radius));
                          if (anim) {
                              float s = focused ? 1.08f : 1f;
                              x.animate().scaleX(s).scaleY(s).setDuration(140).start();
                          }
                      }
                  });
              }

              public static void round(View v, float rDp) {
                  final float r = dp(v.getContext(), rDp);
                  v.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View x, Outline o) {
                          o.setRoundRect(0, 0, x.getWidth(), x.getHeight(), r);
                      }
                  });
                  v.setClipToOutline(true);
              }
          }
          EOF_GLASS
          mkdir -p app/src/main/java/com/iptv/glass
          cat > app/src/main/java/com/iptv/glass/Img.java << 'EOF_GLASS'
          package com.iptv.glass;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.LruCache;
          import android.widget.ImageView;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class Img {
              private static File dir;
              private static final Handler MAIN = new Handler(Looper.getMainLooper());
              private static final ExecutorService POOL = Executors.newFixedThreadPool(3);
              private static final LruCache<String, Bitmap> CACHE =
                      new LruCache<String, Bitmap>((int) (Runtime.getRuntime().maxMemory() / 8)) {
                          @Override
                          protected int sizeOf(String k, Bitmap b) {
                              return b.getByteCount();
                          }
                      };

              public static void init(Context c) {
                  dir = new File(c.getCacheDir(), "imgs");
                  dir.mkdirs();
              }

              public static void load(final ImageView iv, final String url, final int reqW) {
                  if (url == null) return;
                  iv.setTag(url);
                  Bitmap hit = CACHE.get(url);
                  if (hit != null) {
                      iv.setImageBitmap(hit);
                      return;
                  }
                  iv.setImageDrawable(null);
                  POOL.execute(new Runnable() {
                      @Override
                      public void run() {
                          final Bitmap bm = fetch(url, reqW);
                          if (bm == null) return;
                          CACHE.put(url, bm);
                          MAIN.post(new Runnable() {
                              @Override
                              public void run() {
                                  if (url.equals(iv.getTag())) iv.setImageBitmap(bm);
                              }
                          });
                      }
                  });
              }

              private static Bitmap fetch(String url, int reqW) {
                  try {
                      if (dir == null) return null;
                      File f = new File(dir, Integer.toHexString(url.hashCode()));
                      if (!f.exists()) {
                          HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                          c.setConnectTimeout(10000);
                          c.setReadTimeout(15000);
                          InputStream in = c.getInputStream();
                          File tmp = new File(f.getPath() + ".tmp");
                          FileOutputStream out = new FileOutputStream(tmp);
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                          out.close();
                          in.close();
                          c.disconnect();
                          tmp.renameTo(f);
                      }
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(f.getPath(), o);
                      int s = 1;
                      while (o.outWidth / (s * 2) >= reqW) s *= 2;
                      o = new BitmapFactory.Options();
                      o.inSampleSize = s;
                      o.inPreferredConfig = Bitmap.Config.RGB_565;
                      return BitmapFactory.decodeFile(f.getPath(), o);
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
          EOF_GLASS
          mkdir -p app/src/main/java/com/iptv/glass
          cat > app/src/main/java/com/iptv/glass/Anime.java << 'EOF_GLASS'
          package com.iptv.glass;

          import android.text.Html;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Anime {
              public int id, score, episodes;
              public String title, cover, banner, desc, format, trailer, genres, raw;

              private static String str(JSONObject o, String k) {
                  if (o == null || o.isNull(k)) return null;
                  String s = o.optString(k, "");
                  return s.length() == 0 ? null : s;
              }

              public static Anime from(JSONObject o) {
                  Anime a = new Anime();
                  a.raw = o.toString();
                  a.id = o.optInt("id");
                  JSONObject t = o.optJSONObject("title");
                  a.title = str(t, "english");
                  if (a.title == null) a.title = str(t, "romaji");
                  if (a.title == null) a.title = "Unknown";
                  a.cover = str(o.optJSONObject("coverImage"), "large");
                  a.banner = str(o, "bannerImage");
                  String d = str(o, "description");
                  a.desc = d == null ? "Description available nahi hai." : Html.fromHtml(d).toString().trim();
                  a.score = o.optInt("averageScore", 0);
                  a.episodes = o.optInt("episodes", 0);
                  a.format = str(o, "format");
                  JSONArray g = o.optJSONArray("genres");
                  StringBuilder sb = new StringBuilder();
                  if (g != null) {
                      for (int i = 0; i < g.length(); i++) {
                          if (i > 0) sb.append(", ");
                          sb.append(g.optString(i));
                      }
                  }
                  a.genres = sb.toString();
                  JSONObject tr = o.optJSONObject("trailer");
                  if (tr != null && "youtube".equalsIgnoreCase(tr.optString("site"))) a.trailer = str(tr, "id");
                  return a;
              }

              public String meta() {
                  StringBuilder sb = new StringBuilder();
                  if (score > 0) sb.append("Score ").append(score).append("/100");
                  if (format != null) {
                      if (sb.length() > 0) sb.append("  |  ");
                      sb.append(format.replace("_", " "));
                  }
                  if (episodes > 0) {
                      if (sb.length() > 0) sb.append("  |  ");
                      sb.append(episodes).append(" ep");
                  }
                  return sb.toString();
              }

              public String topGenres() {
                  String[] g = genres.split(", ");
                  return g.length > 2 ? g[0] + ", " + g[1] : genres;
              }
          }
          EOF_GLASS
          mkdir -p app/src/main/java/com/iptv/glass
          cat > app/src/main/java/com/iptv/glass/Api.java << 'EOF_GLASS'
          package com.iptv.glass;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Handler;
          import android.os.Looper;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** Anime metadata from AniList (free public API). No video streams. */
          public class Api {
              public interface CB {
                  void done(List<Anime> list, boolean ok);
              }

              private static final String FIELDS =
                      "id title{romaji english} coverImage{large} bannerImage description averageScore genres episodes format trailer{id site}";
              private static final ExecutorService POOL = Executors.newFixedThreadPool(2);
              private static final Handler MAIN = new Handler(Looper.getMainLooper());
              private static final Map<String, List<CB>> PENDING = new HashMap<String, List<CB>>();
              private static final long TTL = 6L * 3600 * 1000;

              public static void clearCache(Context c) {
                  c.getSharedPreferences("glass_cache", 0).edit().clear().apply();
              }

              public static void fetch(Context ctx, final String key, final String filter, final String sort,
                                       final int per, CB cb) {
                  final SharedPreferences sp = ctx.getApplicationContext().getSharedPreferences("glass_cache", 0);
                  final List<CB> mine = new ArrayList<CB>();
                  mine.add(cb);
                  if (key != null) {
                      List<CB> ex = PENDING.get(key);
                      if (ex != null) {
                          ex.add(cb);
                          return;
                      }
                      PENDING.put(key, mine);
                  }
                  POOL.execute(new Runnable() {
                      @Override
                      public void run() {
                          String json = null;
                          boolean fresh = false;
                          if (key != null) {
                              json = sp.getString(key, null);
                              fresh = json != null && System.currentTimeMillis() - sp.getLong(key + "_t", 0) < TTL;
                          }
                          if (!fresh) {
                              String net = request(filter, sort, per);
                              if (net != null) {
                                  json = net;
                                  if (key != null) {
                                      sp.edit().putString(key, net).putLong(key + "_t", System.currentTimeMillis()).apply();
                                  }
                              }
                          }
                          final List<Anime> list = parse(json);
                          final boolean ok = json != null;
                          MAIN.post(new Runnable() {
                              @Override
                              public void run() {
                                  List<CB> targets = key != null ? PENDING.remove(key) : mine;
                                  if (targets != null) for (CB x : targets) x.done(list, ok);
                              }
                          });
                      }
                  });
              }

              private static List<Anime> parse(String json) {
                  List<Anime> out = new ArrayList<Anime>();
                  if (json == null) return out;
                  try {
                      JSONArray arr = new JSONObject(json).getJSONObject("data").getJSONObject("Page").getJSONArray("media");
                      for (int i = 0; i < arr.length(); i++) out.add(Anime.from(arr.getJSONObject(i)));
                  } catch (Exception e) {
                      // empty result
                  }
                  return out;
              }

              private static String request(String filter, String sort, int per) {
                  HttpURLConnection c = null;
                  try {
                      String q = "query{Page(page:1,perPage:" + per + "){media(type:ANIME,isAdult:false"
                              + (filter == null ? "" : "," + filter) + ",sort:[" + sort + "]){" + FIELDS + "}}}";
                      byte[] body = new JSONObject().put("query", q).toString().getBytes("UTF-8");
                      c = (HttpURLConnection) new URL("https://graphql.anilist.co").openConnection();
                      c.setRequestMethod("POST");
                      c.setConnectTimeout(12000);
                      c.setReadTimeout(15000);
                      c.setDoOutput(true);
                      c.setRequestProperty("Content-Type", "application/json");
                      c.setRequestProperty("Accept", "application/json");
                      OutputStream os = c.getOutputStream();
                      os.write(body);
                      os.close();
                      if (c.getResponseCode() != 200) return null;
                      BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = r.readLine()) != null) sb.append(line);
                      r.close();
                      return sb.toString();
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }
          }
          EOF_GLASS
          mkdir -p app/src/main/java/com/iptv/glass
          cat > app/src/main/java/com/iptv/glass/SettingsManager.java << 'EOF_GLASS'
          package com.iptv.glass;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;

          public class SettingsManager {
              private final SharedPreferences p;

              public SettingsManager(Context c) {
                  p = c.getSharedPreferences("glass_settings", Context.MODE_PRIVATE);
              }

              public boolean getBool(String k, boolean d) {
                  return p.getBoolean(k, d);
              }

              public void setBool(String k, boolean v) {
                  p.edit().putBoolean(k, v).apply();
              }

              public int getInt(String k, int d) {
                  return p.getInt(k, d);
              }

              public void setInt(String k, int v) {
                  p.edit().putInt(k, v).apply();
              }

              public List<Anime> anime(String key) {
                  List<Anime> out = new ArrayList<Anime>();
                  try {
                      JSONArray arr = new JSONArray(p.getString(key, "[]"));
                      for (int i = 0; i < arr.length(); i++) out.add(Anime.from(arr.getJSONObject(i)));
                  } catch (JSONException e) {
                      // ignore
                  }
                  return out;
              }

              private void save(String key, List<Anime> l) {
                  JSONArray arr = new JSONArray();
                  for (Anime a : l) {
                      try {
                          arr.put(new JSONObject(a.raw));
                      } catch (JSONException e) {
                          // skip
                      }
                  }
                  p.edit().putString(key, arr.toString()).apply();
              }

              private boolean removeId(List<Anime> l, int id) {
                  boolean found = false;
                  for (Iterator<Anime> it = l.iterator(); it.hasNext(); ) {
                      if (it.next().id == id) {
                          it.remove();
                          found = true;
                      }
                  }
                  return found;
              }

              public boolean toggleFavAnime(Anime a) {
                  List<Anime> l = anime("fav_anime");
                  boolean found = removeId(l, a.id);
                  if (!found) l.add(0, a);
                  save("fav_anime", l);
                  return !found;
              }

              public boolean isFavAnime(int id) {
                  for (Anime x : anime("fav_anime")) if (x.id == id) return true;
                  return false;
              }

              public void pushRecentAnime(Anime a) {
                  List<Anime> l = anime("recent_anime");
                  removeId(l, a.id);
                  l.add(0, a);
                  while (l.size() > 15) l.remove(l.size() - 1);
                  save("recent_anime", l);
              }
          }
          EOF_GLASS
          mkdir -p app/src/main/java/com/iptv/glass
          cat > app/src/main/java/com/iptv/glass/AppManager.java << 'EOF_GLASS'
          package com.iptv.glass;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.drawable.Drawable;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          public class AppManager {
              public static class Item {
                  public String label, pkg;
                  public Drawable icon, banner;
                  public Intent intent;
                  public boolean system;
              }

              private final Context c;
              private final SharedPreferences p;

              public AppManager(Context ctx) {
                  c = ctx;
                  p = ctx.getSharedPreferences("glass_apps", Context.MODE_PRIVATE);
              }

              /** Finds both normal and Android TV (leanback) apps. */
              public List<Item> load() {
                  PackageManager pm = c.getPackageManager();
                  Map<String, Item> map = new LinkedHashMap<String, Item>();
                  String[] cats = {Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER};
                  for (String cat : cats) {
                      Intent q = new Intent(Intent.ACTION_MAIN).addCategory(cat);
                      for (ResolveInfo ri : pm.queryIntentActivities(q, 0)) {
                          String pkg = ri.activityInfo.packageName;
                          if (pkg.equals(c.getPackageName()) || map.containsKey(pkg)) continue;
                          Item it = new Item();
                          it.pkg = pkg;
                          it.label = String.valueOf(ri.loadLabel(pm));
                          it.icon = ri.loadIcon(pm);
                          if (cat.equals(Intent.CATEGORY_LEANBACK_LAUNCHER)) it.banner = ri.activityInfo.loadBanner(pm);
                          it.intent = new Intent(Intent.ACTION_MAIN).addCategory(cat)
                                  .setClassName(pkg, ri.activityInfo.name)
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                          it.system = (ri.activityInfo.applicationInfo.flags & ApplicationInfo.FLAG_SYSTEM) != 0;
                          map.put(pkg, it);
                      }
                  }
                  List<Item> list = new ArrayList<Item>(map.values());
                  Collections.sort(list, new Comparator<Item>() {
                      @Override
                      public int compare(Item a, Item b) {
                          return a.label.compareToIgnoreCase(b.label);
                      }
                  });
                  return list;
              }

              public boolean launch(Context ctx, Item it) {
                  try {
                      ctx.startActivity(it.intent);
                      pushRecent(it.pkg);
                      return true;
                  } catch (Exception e) {
                      Toast.makeText(ctx, "App khul nahi paya", Toast.LENGTH_SHORT).show();
                      return false;
                  }
              }

              public Set<String> favs() {
                  return new HashSet<String>(p.getStringSet("fav_pkgs", new HashSet<String>()));
              }

              public boolean toggleFav(String pkg) {
                  Set<String> s = favs();
                  boolean on = !s.remove(pkg);
                  if (on) s.add(pkg);
                  p.edit().putStringSet("fav_pkgs", s).apply();
                  return on;
              }

              public List<String> recent() {
                  String r = p.getString("recent_pkgs", "");
                  List<String> l = new ArrayList<String>();
                  if (r.length() > 0) l.addAll(Arrays.asList(r.split(",")));
                  return l;
              }

              private void pushRecent(String pkg) {
                  List<String> l = recent();
                  l.remove(pkg);
                  l.add(0, pkg);
                  while (l.size() > 12) l.remove(l.size() - 1);
                  StringBuilder sb = new StringBuilder();
                  for (String s : l) {
                      if (sb.length() > 0) sb.append(",");
                      sb.append(s);
                  }
                  p.edit().putString("recent_pkgs", sb.toString()).apply();
              }
          }
          EOF_GLASS
          mkdir -p app/src/main/java/com/iptv/glass
          cat > app/src/main/java/com/iptv/glass/DetailActivity.java << 'EOF_GLASS'
          package com.iptv.glass;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONObject;

          public class DetailActivity extends Activity {
              private static final String[] NAMES = {"Crunchyroll", "Netflix", "Prime Video", "JioHotstar", "Zee5", "SonyLIV", "YouTube"};
              private static final String[][] PKGS = {
                      {"com.crunchyroll.crunchyroid"},
                      {"com.netflix.ninja", "com.netflix.mediaclient"},
                      {"com.amazon.amazonvideo.livingroom", "com.amazon.avod.thirdpartyclient"},
                      {"in.startv.hotstar"},
                      {"com.graymatrix.did"},
                      {"com.sonyliv"},
                      {"com.google.android.youtube.tv", "com.google.android.youtube"}};

              private Anime a;
              private SettingsManager st;

              private int dp(float v) {
                  return U.dp(this, v);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Img.init(this);
                  st = new SettingsManager(this);
                  try {
                      a = Anime.from(new JSONObject(getIntent().getStringExtra("raw")));
                  } catch (Exception e) {
                      finish();
                      return;
                  }
                  boolean anim = st.getBool("anim", true);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackground(U.wallpaper(st.getInt("theme", 0)));
                  ImageView bg = new ImageView(this);
                  bg.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  bg.setAlpha(0.3f);
                  root.addView(bg, new FrameLayout.LayoutParams(-1, -1));
