              private View appCard(final AppManager.Item it) {
                  FrameLayout f = new FrameLayout(this);
                  int p = dp(3);
                  f.setPadding(p, p, p, p);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(180), dp(104));
                  lp.setMargins(dp(8), 0, dp(8), 0);
