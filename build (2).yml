              private void load(final LinearLayout r, String key, String filter, String sort,
                                final int w, final int hh, final boolean wide, final int max) {
                  final int tk = token;
                  r.addView(label("Loading..."));
                  Api.fetch(this, key, filter, sort, 20, new Api.CB() {
                      @Override
                      public void done(List<Anime> l, boolean ok) {
                          if (tk != token) return;
                          r.removeAllViews();
                          List<Anime> use = new ArrayList<Anime>();
                          if (wide) for (Anime a : l) if (a.banner != null) use.add(a);
                          if (use.isEmpty()) use.addAll(l);
                          if (use.isEmpty()) {
                              r.addView(msgCard(ok ? "Kuch nahi mila" : "Internet / server problem. OK dabake dobara try karein"));
                              return;
                          }
                          int n = 0;
                          for (Anime a : use) {
                              if (n++ >= max) break;
                              r.addView(poster(a, w, hh, wide));
                          }
                      }
                  });
              }

