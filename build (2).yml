                      t.setEllipsize(TextUtils.TruncateAt.END);
                      t.setPadding(dp(6), 0, dp(6), dp(6));
                      inner.addView(t, new FrameLayout.LayoutParams(MATCH, WRAP, Gravity.BOTTOM));
                  }
                  f.addView(inner, new FrameLayout.LayoutParams(MATCH, MATCH));

                  U.focusable(f, st.getBool("anim", true), 15);
                  f.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          am.launch(MainActivity.this, it);
                      }
                  });
                  f.setOnLongClickListener(new View.OnLongClickListener() {
                      @Override
                      public boolean onLongClick(View v) {
                          boolean on = am.toggleFav(it.pkg);
                          Toast.makeText(MainActivity.this, on ? "Favorites mein joda" : "Favorites se hataya",
                                  Toast.LENGTH_SHORT).show();
                          return true;
                      }
                  });
                  return f;
              }

              private void appGrid(String title, List<AppManager.Item> items) {
                  if (items.isEmpty()) return;
                  for (int i = 0; i < items.size(); i += 6) {
                      LinearLayout r = row(i == 0 ? title : null);
                      for (int j = i; j < Math.min(i + 6, items.size()); j++) r.addView(appCard(items.get(j)));
                  }
              }

              private boolean isStream(AppManager.Item it) {
                  String p = it.pkg.toLowerCase();
                  for (String s : STREAM) if (p.contains(s)) return true;
                  return false;
              }

              private void promptSearch() {
                  final EditText et = new EditText(this);
                  et.setSingleLine(true);
                  et.setHint("Anime ka naam");
                  et.setInputType(InputType.TYPE_CLASS_TEXT);
                  new AlertDialog.Builder(this)
                          .setTitle("Search anime")
                          .setView(et)
                          .setPositiveButton("Search", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface d, int w) {
                                  query = et.getText().toString().trim();
                                  if (query.length() > 0) show("Search");
                              }
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }
          }
          EOF_GLASS

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build debug APK
        working-directory: GLASS-TV
        run: gradle assembleDebug --no-daemon

      - name: Show built APK files
        run: find GLASS-TV -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLASS-TV-debug-apk
          path: GLASS-TV/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
